services:
  fraud-monitoring-dashboard:
    build: .
    ports:
      - "8016:8016"
    env_file:
      - path: .env
        required: false
    volumes:
      - monitor-data:/srv/app/var
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  monitor-data:
